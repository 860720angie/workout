<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pitch Ready</title>
<meta name="description" content="A 4-day gym plan for soccer: conditioning, hip and glute strength, and a core block of upper abs, lower abs, obliques and rib-side work.">
<meta name="theme-color" content="#1E7A47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one narrow column like a coach's clipboard; sticky day tabs; each block colour-coded by its job. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#14201A; --muted:#5C6B62; --line:#DCE3DD;
  --accent:#1E7A47; --accent-ink:#FFFFFF; --accent-soft:#E2F1E7;
  --warm:#B7791F; --strength:#1E7A47; --core:#C2412D; --cond:#2364A6;
  --tick:#1E7A47; --danger:#B42318;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#16211B; --ink:#E6EDE8; --muted:#97A89D; --line:#27352D;
  --accent:#4CC27E; --accent-ink:#06210F; --accent-soft:#183224;
  --warm:#E0A646; --strength:#4CC27E; --core:#F07A63; --cond:#6AA8E8;
  --tick:#4CC27E; --danger:#F97066; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16211B; --ink:#E6EDE8; --muted:#97A89D; --line:#27352D;
  --accent:#4CC27E; --accent-ink:#06210F; --accent-soft:#183224;
  --warm:#E0A646; --strength:#4CC27E; --core:#F07A63; --cond:#6AA8E8;
  --tick:#4CC27E; --danger:#F97066; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.brand small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:64px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;text-align:left}
.tab b{display:block;font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.tab span{font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{color:inherit;opacity:.85}
.dayhead{padding-block:18px 6px}
.dayhead h2{font-family:var(--display);font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
.dayhead p{margin:6px 0 0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tick);transition:width .3s}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:3px solid var(--c);padding-top:8px}
.sec-h h3{margin:0;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;color:var(--c)}
.sec-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-note{font-size:14px;color:var(--muted);margin:4px 0 0}
.k-warm{--c:var(--warm)} .k-strength{--c:var(--strength)} .k-core{--c:var(--core)} .k-cond{--c:var(--cond)}
ul.ex-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.ex.done{opacity:.6}
.ex-main{min-width:0}
.ex-name{font-weight:600;font-size:17px;line-height:1.25}
.ex-rx{font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:2px}
.ex-rx em{font-style:normal;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--core);border:1px solid var(--core);border-radius:4px;padding:1px 6px;margin-right:4px;vertical-align:1px}
.ex-note{font-size:14px;color:var(--muted);margin-top:4px}
.watch{display:inline-flex;align-items:center;gap:6px;align-self:start;text-decoration:none;font-size:14px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:6px 12px;white-space:nowrap}
.watch svg{width:12px;height:12px;fill:currentColor}
.sets{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.set{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;display:grid;place-items:center}
.set.on{background:var(--tick);border-color:var(--tick);color:var(--accent-ink)}
.tools{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.tools .btn{padding:6px 10px;font-size:13px}
.add{margin-top:8px;width:100%;border:1px dashed var(--c);color:var(--c);background:transparent;border-radius:10px;padding:10px;font-weight:600}
form.edit{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:12px;margin-top:8px}
form.edit label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
form.edit label.full{grid-column:1/-1}
form.edit input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px;font-size:16px;color:var(--ink)}
form.edit .row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
form.edit .err{grid-column:1/-1;color:var(--danger);font-size:14px;margin:0}
.dayedit{display:grid;grid-template-columns:90px 1fr;gap:10px;margin-top:12px}
.dayedit label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.dayedit label.full{grid-column:1/-1}
.dayedit input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px;font-size:16px;color:var(--ink)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);color:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar p{margin:0;flex:1 1 180px;font-size:14px}
.savebar .btn{border-color:transparent}
.savebar .btn.ghost{background:transparent;color:var(--bg);border-color:var(--muted)}
.guide h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:20px;margin:24px 0 8px}
.week{display:grid;gap:6px}
.week div{display:grid;grid-template-columns:52px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.week b{font-family:var(--display);font-size:18px;text-transform:uppercase}
.guide ol,.guide ul{margin:0;padding-left:22px;display:grid;gap:8px}
.guide .callout{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:8px}
.bu-wrap{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.bu{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.bu th,.bu td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.bu thead th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--cond)}
.bu tbody th{font-family:var(--display);font-size:18px;white-space:nowrap}
.bu tbody tr:last-child th,.bu tbody tr:last-child td{border-bottom:0}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px}
@media (max-width:420px){form.edit{grid-template-columns:1fr}.dayedit{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.btn.small{padding:2px 8px;font-size:12px}
.bk{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.restore{display:grid;gap:8px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.restore label{font-size:13px;color:var(--muted)}
.restore textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px;font:13px/1.4 ui-monospace,monospace}
.restore .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.restore .err,.guide .err{color:var(--danger);font-size:14px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.wk-c{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px;display:grid;justify-items:center;gap:1px;min-width:0;font-size:11px;color:var(--muted)}
.wk-c b{font-family:var(--display);font-size:15px;color:var(--ink);text-transform:uppercase}
.wk-c span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-c i{font-style:normal;font-weight:700;height:16px;line-height:16px}
.wk-c[disabled]{opacity:.55;cursor:default}
.wk-c.is-today{outline:2px solid var(--ink);outline-offset:-1px}
.wk-c.st-done{background:var(--tick);border-color:var(--tick);color:var(--accent-ink)}
.wk-c.st-done b{color:var(--accent-ink)}
.wk-c.st-min{background:var(--accent-soft);border-color:var(--tick)}
.wk-c.st-min i{color:var(--tick)}
.wk-c.st-missed{border-color:var(--danger)}
.wk-c.st-missed i{color:var(--danger)}
.wk-c.st-today{border-color:var(--accent)}
.status{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.nag{margin-top:10px;padding:10px 12px;border-radius:8px;border-left:4px solid var(--danger);background:var(--surface);font-size:14px}
.note-b{margin-top:10px;padding:10px 12px;border-radius:8px;border-left:4px solid var(--warm);background:var(--surface);font-size:14px}
.banner{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.banner.today{border-color:var(--accent);background:var(--accent-soft)}
.banner.ok{border-color:var(--tick);background:var(--accent-soft);font-weight:600}
.banner.miss{border-color:var(--danger)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.move{margin-top:8px;display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.move p{margin:0 0 4px;font-weight:600}
.muted{color:var(--muted);font-weight:400}
.mv{display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-align:left;border:1px solid var(--accent);background:var(--bg);border-radius:8px;padding:10px 12px}
.mv span{font-size:13px;color:var(--muted)}
.mv.no{border-color:var(--line);opacity:.6;cursor:default}
.stage{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px dashed var(--cond);font-size:14px}
.finish{display:block;width:100%;margin-top:24px;border:0;border-radius:12px;padding:16px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.center{text-align:center}
.tab.tdone b{color:var(--tick)}
.tab.tdone[aria-selected="true"] b{color:inherit}
.bu tr.cur td,.bu tr.cur th{background:var(--accent-soft)}
.startlab{display:grid;gap:4px;margin-top:10px;font-size:13px;color:var(--muted)}
.startlab input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px;font-size:16px;max-width:220px}
</style>
</head>

{"blocks":[{"id":"b1","name":"Block 1","days":[{"id":"d1","weekday":"Mon","title":"Lower A: hips and glutes","focus":"Rebuild the hip. Glute strength through a range that doesn't hurt.","sections":[{"id":"d1k","kind":"cond","title":"Conditioning: rower","minutes":18,"note":"Start here. The rower is low-impact, so it's kind to the hip before a leg day.","items":[{"id":"a1","name":"Easy row","sets":1,"reps":"5 min","rest":"","note":"Build from very easy to moderate. Push with the legs, then pull with the arms.","q":"rowing machine technique"},{"id":"a2","name":"Rower intervals","sets":8,"reps":"250 m hard","rest":"90 s easy row","note":"Weeks 1-2: 5 rounds at a steady-hard pace. Weeks 3-4: 6 rounds. Week 5 on: 8 rounds. Try to hold the same split time every round.","q":"rowing machine interval workout"}]},{"id":"d1w","kind":"warm","title":"Hip and knee prep","minutes":14,"items":[{"id":"a3","name":"90/90 hip switches","sets":2,"reps":"8 / side","rest":"","note":"Slow. Only go as far as the hip allows.","q":"90 90 hip switch mobility"},{"id":"a4","name":"Glute bridge with 2 s pause","sets":2,"reps":"12","rest":"","note":"Feel it in the glutes, not the low back.","q":"glute bridge"},{"id":"a5","name":"Banded clamshell","sets":2,"reps":"15 / side","rest":"","note":"Mini band just above the knees. Bring a band if the gym has none."},{"id":"a6","name":"Side-lying leg raise","sets":2,"reps":"12 / side","rest":"","note":"Toes point forward, lead with the heel.","q":"side lying hip abduction"},{"id":"a7","name":"Bird dog","sets":2,"reps":"8 / side","rest":"","note":"Keep the hips level and reach long."},{"id":"a22","name":"Heel prop knee hang","sets":2,"reps":"90 s / leg","rest":"","note":"Sit with the heel on a bench, nothing under the knee, and let the knee sag straight. Add a light plate on the thigh when it gets easy. Stiffer knee: do one extra round on that side. A strong stretch is fine, sharp pain is not.","q":"heel prop knee extension stretch"}]},{"id":"d1s","kind":"strength","title":"Strength","minutes":50,"items":[{"id":"a21","name":"Spanish squat hold","sets":4,"reps":"30-45 s","rest":"60 s","note":"Heavy band around a rack and behind both knees, sit back to a half squat with shins vertical. Loads the patellar tendon and often eases knee pain before squats. No band: wall sit.","q":"spanish squat isometric patellar tendon"},{"id":"a8","name":"Goblet box squat","sets":4,"reps":"8","rest":"90 s","note":"Sit back to a bench at a height that doesn't hurt. Go lower over the weeks.","q":"goblet box squat"},{"id":"a9","name":"Dumbbell Romanian deadlift","sets":4,"reps":"8","rest":"90 s","note":"Hips back, soft knees, flat back. Stop when the hamstrings are tight."},{"id":"a10","name":"Hip thrust","sets":4,"reps":"10","rest":"90 s","note":"Upper back on a bench, dumbbell on the hips. Pause 1 s at the top.","q":"dumbbell hip thrust"},{"id":"a11","name":"Split squat","sets":3,"reps":"8 / side","rest":"60 s","note":"Hold the bench for balance in weeks 1 and 2. Front knee follows the toes.","q":"dumbbell split squat"},{"id":"a12","name":"Banded lateral walk","sets":3,"reps":"12 steps each way","rest":"45 s","note":"Stay low with toes forward. The burn on the side of the hip is the point.","q":"banded lateral walk"},{"id":"a13","name":"Single-leg calf raise","sets":3,"reps":"12 / side","rest":"45 s","note":"Full range on a step."}]},{"id":"d1c","kind":"core","title":"Core: upper, lower, obliques, rib side","minutes":18,"items":[{"id":"g1","tag":"Upper abs","name":"Weighted crunch","sets":3,"reps":"12","rest":"30 s","note":"Lie on a bench with a plate or dumbbell on your chest. Curl the ribs towards the hips, then lower for 3 seconds.","q":"weighted crunch plate"},{"id":"g2","tag":"Lower abs","name":"Reverse crunch","sets":3,"reps":"12","rest":"30 s","note":"Knees bent, lift the hips off the bench, not just the legs. Slow on the way down.","q":"reverse crunch"},{"id":"g3","tag":"Obliques","name":"Slow Russian twist","sets":3,"reps":"12 / side","rest":"30 s","note":"Chest tall, twist from the ribs and hold 2 seconds each side. A light plate makes it harder.","q":"russian twist"},{"id":"g4","tag":"Ribs, side","name":"Heavy dumbbell side bend","sets":3,"reps":"12 / side","rest":"45 s","note":"The intense one. One heavy dumbbell, free hand behind the head. Bend straight down over the side of your ribs, 2 second squeeze at the bottom, no twisting. The last 2 reps should be hard.","q":"dumbbell side bend"}],"note":"Always this order: upper abs, lower abs, obliques, then the intense one for the side of your ribs."}]},{"id":"d2","weekday":"Tue","title":"Upper: push, pull, carry","focus":"Your main running day (legs are fresh), then upper-body strength.","sections":[{"id":"d2k","kind":"cond","title":"Conditioning: treadmill run build-up","minutes":25,"note":"Start here. Follow the stage for your week. Check the build-up on the Guide tab.","items":[{"id":"b1","name":"Brisk walk","sets":1,"reps":"5 min","rest":"","note":"Raise the speed every minute until you're nearly jogging.","q":"treadmill warm up walk"},{"id":"b2","name":"Run / walk intervals","sets":8,"reps":"see stage","rest":"","note":"Weeks 1-2: 1 min jog / 2 min walk. Weeks 3-4: 2 min jog / 1 min walk. Weeks 5-6: 20 min easy jog, no stops (tick 1 circle per 2.5 min). Week 7 on: 3 × 6 min at 'comfortably hard' with 2 min walk.","q":"run walk interval beginner"},{"id":"b3","name":"Cool walk","sets":1,"reps":"3 min","rest":"","note":"Bring the breathing down before you lift."}]},{"id":"d2w","kind":"warm","title":"Hip and shoulder prep","minutes":10,"items":[{"id":"b4","name":"Frog pump","sets":2,"reps":"20","rest":"","note":"Soles of the feet together, knees out, short quick bridges.","q":"frog pump glute"},{"id":"b5","name":"Fire hydrant","sets":2,"reps":"10 / side","rest":"","note":"On all fours, lift the knee out to the side. Keep the back still.","q":"fire hydrant exercise"},{"id":"b6","name":"Quadruped hip circles","sets":2,"reps":"6 / side each way","rest":"","note":"Big slow circles with the knee. Smaller circles on the stiffer side if needed.","q":"quadruped hip circles"},{"id":"b7","name":"Band pull-apart","sets":2,"reps":"15","rest":"","note":"Arms straight, squeeze the shoulder blades."},{"id":"b8","name":"Scap push-up","sets":2,"reps":"10","rest":"","note":"Arms straight. Only the shoulder blades move.","q":"scapular push up"}]},{"id":"d2s","kind":"strength","title":"Strength","minutes":50,"items":[{"id":"b9","name":"Dumbbell bench press","sets":4,"reps":"8","rest":"90 s","note":"Feet flat, shoulder blades pinched."},{"id":"b10","name":"One-arm dumbbell row","sets":4,"reps":"10 / side","rest":"60 s","note":"Hand and knee on the bench, pull the elbow to the hip."},{"id":"b11","name":"Half-kneeling dumbbell press","sets":3,"reps":"8 / side","rest":"60 s","note":"Kneeling stretches the hip flexor too. Squeeze the glute of the down leg.","q":"half kneeling single arm dumbbell press"},{"id":"b12","name":"Lat pulldown or pull-up","sets":3,"reps":"8","rest":"90 s","note":"No machine? Use a band for assisted pull-ups.","q":"band assisted pull up"},{"id":"b13","name":"Push-up","sets":3,"reps":"max, stop 2 before failure","rest":"60 s","note":"Body in one straight line."},{"id":"b14","name":"Face pull","sets":3,"reps":"15","rest":"45 s","note":"Cable or band. Good for shoulders and posture.","q":"cable face pull"},{"id":"b22","name":"45° back extension","sets":3,"reps":"12","rest":"60 s","note":"Lower back. Hinge from the hips, rise to a straight line, no over-arching. No bench: floor Superman holds, 3 × 20 s.","q":"45 degree back extension form"}]},{"id":"d2c","kind":"core","title":"Core: upper, lower, obliques, rib side","minutes":18,"items":[{"id":"g5","tag":"Upper abs","name":"Stability ball crunch","sets":3,"reps":"15","rest":"30 s","note":"Low back on the ball, curl up and hold 1 second at the top. Feet hip width for balance.","q":"stability ball crunch"},{"id":"g6","tag":"Lower abs","name":"Lying leg raise" y back.","q":"cable rotation"},{"id":"g24","tag":"Ribs, side","name":"Weighted side plank reach-through","sets":3,"reps":"8 / side","rest":"45 s","note":"The intense one. Side plank on a bench, plate on the hip, reach the top arm under your body and back up. Keep the hips high.","q":"side plank reach through weight"}],"note":"Always this order: upper abs, lower abs, obliques, then the intense one for the side of your ribs."}]},{"id":"f3","weekday":"Thu","title":"Lower B: single leg and soccer","focus":"Block 2. Harder single-leg work, longer groin and hamstring protection, first real power.","sections":[{"id":"f3k","kind":"cond","title":"Conditioning: rope and rower","minutes":22,"note":"Start here. Quick feet first, then a steady engine.","items":[{"id":"o1","name":"Easy rower","sets":1,"reps":"5 min","rest":"","note":"Build from easy to moderate."},{"id":"o2","name":"Jump rope, mixed footwork","sets":10,"reps":"40 s on / 20 s off","rest":"","note":"Alternate: both feet, running step, side to side. Stop if the hip complains.","q":"jump rope footwork drills"},{"id":"o3","name":"Rower 1000 m","sets":2,"reps":"1000 m steady-hard","rest":"2 min","note":"About 7 out of 10. Write down your time.","q":"rowing 1000m pacing"}]},{"id":"f3w","kind":"warm","title":"Hip and knee prep","minutes":14,"items":[{"id":"o4","name":"Hip hinge with a stick","sets":2,"reps":"10","rest":"","note":"Stick on the back touching head, upper back and tailbone. Push the hips back.","q":"hip hinge dowel drill"},{"id":"o5","name":"Standing banded fire hydrant","sets":2,"reps":"10 / side","rest":"","note":"Band at the knees, hold a rack, lift the knee out to the side.","q":"standing banded fire hydrant"},{"id":"o6","name":"Hurdle step-over","sets":2,"reps":"6 / side","rest":"","note":"Step sideways over a low bench or hurdle, knee high, hips level.","q":"lateral hurdle step over mobility"},{"id":"o7","name":"Walking knee hug","sets":2,"reps":"10 m","rest":"","note":"Pull the knee to the chest, rise don isometric"}]},{"id":"f3c","kind":"core","title":"Core: upper, lower, obliques, rib side","minutes":18,"items":[{"id":"g25","tag":"Upper abs","name":"Decline sit-up with a plate","sets":3,"reps":"10","rest":"30 s","note":"Plate on the chest, full range but controlled. Stop if the low back complains.","q":"decline sit up plate"},{"id":"g26","tag":"Lower abs","name":"Hollow rock","sets":3,"reps":"15","rest":"30 s","note":"From the hollow hold, rock from the shoulder blades to the tailbone. Keep the shape the whole time.","q":"hollow rock"},{"id":"g27","tag":"Obliques","name":"Med ball rotational throw","sets":3,"reps":"8 / side","rest":"45 s","note":"Stand side-on to a wall, throw and catch. Turn the hips, not just the arms.","q":"med ball rotational throw"},{"id":"g28","tag":"Ribs, side","name":"Heavy suitcase hold","sets":3,"reps":"30 s / side","rest":"45 s","note":"The intense one. One very heavy dumbbell in one hand, stand tall, do not lean to the other side. The side of your ribs and low back will burn.","q":"suitcase hold"}],"note":"Always this order: upper abs, lower abs, obliques, then the intense one for the side of your ribs."}]},{"id":"f4","weekday":"Sat","title":"Full body: match engine","focus":"Block 2. Hills and match-speed footwork, then powerful full-body lifts.","sections":[{"id":"f4k","kind":"cond","title":"Conditioning: hills and repeat sprints","minutes":24,"note":"Start here. Hills build sprint power with less pounding than flat sprints.","items":[{"id":"p1","name":"Easy jog","sets":1,"reps":"5 min","rest":"","note":"Treadmill, last minute a bit quicker."},{"id":"p2","name":"Treadmill hill repeats","sets":8,"reps":"30 s hard at 8-10% incline","rest":"60 s walk","note":"Drive the knees, short quick steps. Straddle the belt to rest.","q":"treadmill hill sprints"},{"id":"p3","name":"15/15 run","sets":1,"reps":"10 × (15 s fast / 15 s easy)","rest":"","note":"Flat treadmill. The match engine you built in Block 1.","q":"15 15 interval run"}]},{"id":"f4w","kind":"warm","title":"Hip prep and footwork","minutes":12,"items":[{"id":"p4","name":"Inchworm","sets":2,"reps":"5","rest":"","note":"Walk the hands out to a plank and back. Soft knees are fine.","q":"inchworm exercise"},{"id":"p5","name":"Carioca","sets":2,"reps":"20 m each way","rest":"","note":"Sideways, back foot crosses in front and behind. Loosens the hips.","q":"carioca drill"},{"id":"p6","name":"High knees","sets":2,"reps":"20 m","rest":"","note":"Quick and light, stay tall."},{"id":"p7","name":"Backpedal","sets":2,"reps":"20 m","rest":"","note":"Stay low, push off the front of the foot.","q":"backpedal drill"},{"id":"p8","name":"Sprint and stop","sets":4,"reps":"1","rest":"45 s","note":"Run 10 m, stop within 3 steps, low and balanced. Teaches the hip to brake.","q":"deceleration drill soccer"}]},{"id":"f4s","kind":"strength","title":"Strength","minutes":35,"items":[{"id":"p9","name":"Dumbbell thruster","sets":3,"reps":"8","rest":"75 s","note":"Squat to pain-free depth, drive up and press overhead in one move.","q":"dumbbell thruster"},{"id":"p10","name":"Neutral-grip pull-up or pulldown","sets":3,"reps":"8","rest":"90 s","note":"Palms facing each other. Band if needed.","q":"neutral grip pull up"},{"id":"p11","name":"Dumbbell swing","sets":3,"reps":"12","rest":"60 s","note":"A hip snap, not a squat. Only if the hip is pain-free; otherwise do more pull-throughs.","q":"dumbbell swing"},{"id":"p12","name":"T push-up","sets":3,"reps":"6 / side","rest":"60 s","note":"Push up, then rotate one arm to the ceiling.","q":"t push up"},{"id":"p13","name":"Goblet march","sets":3,"reps":"30 m","rest":"60 s","note":"Heavy dumbbell at the chest, slow high-knee march.","q":"goblet carry march"}]},{"id":"f4c","kind":"core","title":"Core: upper, lower, obliques, rib side","minutes":18,"items":[{"id":"g29","tag":"Upper abs","name":"Hanging knee-to-elbow","sets":3,"reps":"8","rest":"45 s","note":"Hang tall and curl the ribs down as the legs come up. Skip it if you swing.","q":"knee to elbow"},{"id":"g30","tag":"Lower abs","name":"Lying leg raise with pause","sets":3,"reps":"10","rest":"30 s","note":"Hold the legs 15 cm off the floor for 2 seconds each rep. Low back stays down.","q":"lying leg raise pause"},{"id":"g31","tag":"Obliques","name":"Landmine rotation","sets":3,"reps":"10 / side","rest":"30 s","note":"Bar in one hand at your chest, rotate away from the bar and back. Hips stay square.","q":"landmine rotation"},{"id":"g32","tag":"Ribs, side","name":"Turkish get-up, light","sets":3,"reps":"3 / side","rest":"60 s","note":"The intense one. Light bell, slow and deliberate, stay under the bell the whole way up and down. Practise the movement with no weight first.","q":"turkish get up"}],"note":"Always this order: upper abs, lower abs, obliques, then the intense one for the side of your ribs."}]}],"progressive":false}],"buildup":[{"weeks":"1-2","mon":"5 × 250 m","tue":"8 × (1 min jog / 2 min walk)","thu":"Rope 20 s on / 40 s off, both feet","sat":"15/15 on the bike or rower"},{"weeks":"3-4","mon":"6 × 250 m","tue":"8 × (2 min jog / 1 min walk)","thu":"Rope 30 s on / 30 s off","sat":"15/15 on the bike or rower (wk 3), incline fast walk (wk 4)"},{"weeks":"5-6","mon":"8 × 250 m","tue":"20 min easy jog, no stops","thu":"Rope 40 s on / 20 s off, try alternating feet","sat":"15/15 incline fast walk on the treadmill"},{"weeks":"7+","mon":"8 × 250 m, beat your split times","tue":"3 × 6 min comfortably hard, 2 min walk","thu":"Rope 40 s, add double-unders or side-to-side hops","sat":"15/15 treadmill run"}],"week":[{"day":"Mon","what":"Lower A (default)"},{"day":"Tue","what":"Upper (default)"},{"day":"Wed","what":"Off: 30 min brisk walk, 10 min hip prep and 5 min knee straightening (heel prop) at home"},{"day":"Thu","what":"Lower B (default)"},{"day":"Fri","what":"Off, or soccer training"},{"day":"Sat","what":"Full body (default)"},{"day":"Sun","what":"Rest, or an easy walk"}],"rules":["If you have a hip injury or have had hip surgery, check this plan with your physio first, especially the running, jump rope, jumps and Copenhagen planks.","Some discomfort is fine: up to 3 out of 10 that's gone by the next morning. Sharp or pinching pain in the hip means stop that exercise and swap it.","Running and rope move up one stage only when the current stage felt easy and the hip was quiet the next day. If not, repeat the stage. Going back a stage is fine.","Weeks 1 and 2: light weights, finishing every set with 3-4 reps left. You're learning the movements.","To progress, add reps first and weight second. Change one thing at a time.","Always do one-leg work on the weaker side first, then match the reps on the stronger side.","Box jumps and shuttles start in week 4, only once the hip is pain-free in the strength work.","Knee straightening work: hold the stretch, breathe, never push into sharp pain. If the knee doesn’t improve in a few weeks, have a physio check it."],"discipline":["4 workouts a week is the target. The week runs Monday to Sunday.","Sore or tired? Move the workout to a later day this week. You get 2 moves a week.","The app won’t let you put Lower A and Lower B on back-to-back days, or train 3 days in a row. That protects the hip.","No energy at all? Do the minimum session: conditioning, hip prep and core. It still counts.","Never miss twice. Missing one session is normal. Missing the next one too is how habits break.","Tap Finish at the end of every session. That builds your weekly record and streak."],"fuel":["Protein: about 1.6-2 g per kg of body weight a day. That is what keeps the muscle while you get leaner.","Eat about 300-500 kcal a day below what keeps your weight steady. Aim to lose no more than 0.5 kg a week, so your strength keeps going up.","Sleep 7-8 hours. Recovery is where most of the progress happens."],"v":3,"added":[{"v":2,"ids":["a22","a21","b22","c23","c22","m22","m21","n22","o23","o22"]}]}
