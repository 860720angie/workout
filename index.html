<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pitch Ready</title>
<meta name="description" content="A 4-day gym plan for soccer: conditioning, hip and glute strength, core and obliques.">
<meta name="theme-color" content="#1E7A47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one narrow column like a coach's clipboard; sticky day tabs; each block colour-coded by its job. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#14201A; --muted:#5C6B62; --line:#DCE3DD;
  --accent:#1E7A47; --accent-ink:#FFFFFF; --accent-soft:#E2F1E7;
  --warm:#B7791F; --strength:#1E7A47; --core:#C2412D; --cond:#2364A6; --cool:#4F6B78;
  --tick:#1E7A47; --danger:#B42318;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#16211B; --ink:#E6EDE8; --muted:#97A89D; --line:#27352D;
  --accent:#4CC27E; --accent-ink:#06210F; --accent-soft:#183224;
  --warm:#E0A646; --strength:#4CC27E; --core:#F07A63; --cond:#6AA8E8; --cool:#93AEBB;
  --tick:#4CC27E; --danger:#F97066; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16211B; --ink:#E6EDE8; --muted:#97A89D; --line:#27352D;
  --accent:#4CC27E; --accent-ink:#06210F; --accent-soft:#183224;
  --warm:#E0A646; --strength:#4CC27E; --core:#F07A63; --cond:#6AA8E8; --cool:#93AEBB;
  --tick:#4CC27E; --danger:#F97066; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.brand small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:64px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;text-align:left}
.tab b{display:block;font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.tab span{font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{color:inherit;opacity:.85}
.dayhead{padding-block:18px 6px}
.dayhead h2{font-family:var(--display);font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
.dayhead p{margin:6px 0 0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tick);transition:width .3s}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:3px solid var(--c);padding-top:8px}
.sec-h h3{margin:0;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;color:var(--c)}
.sec-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-note{font-size:14px;color:var(--muted);margin:4px 0 0}
.k-warm{--c:var(--warm)} .k-strength{--c:var(--strength)} .k-core{--c:var(--core)} .k-cond{--c:var(--cond)} .k-cool{--c:var(--cool)}
ul.ex-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.ex.done{opacity:.6}
.ex-main{min-width:0}
.ex-name{font-weight:600;font-size:17px;line-height:1.25}
.ex-rx{font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:2px}
.ex-rx em{font-style:normal;color:var(--muted)}
.ex-note{font-size:14px;color:var(--muted);margin-top:4px}
.watch{display:inline-flex;align-items:center;gap:6px;align-self:start;text-decoration:none;font-size:14px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:6px 12px;white-space:nowrap}
.watch svg{width:12px;height:12px;fill:currentColor}
.sets{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.set{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;display:grid;place-items:center}
.set.on{background:var(--tick);border-color:var(--tick);color:var(--accent-ink)}
.tools{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.tools .btn{padding:6px 10px;font-size:13px}
.add{margin-top:8px;width:100%;border:1px dashed var(--c);color:var(--c);background:transparent;border-radius:10px;padding:10px;font-weight:600}
form.edit{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:12px;margin-top:8px}
form.edit label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
form.edit label.full{grid-column:1/-1}
form.edit input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px;font-size:16px;color:var(--ink)}
form.edit .row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
form.edit .err{grid-column:1/-1;color:var(--danger);font-size:14px;margin:0}
.dayedit{display:grid;grid-template-columns:90px 1fr;gap:10px;margin-top:12px}
.dayedit label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.dayedit label.full{grid-column:1/-1}
.dayedit input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px;font-size:16px;color:var(--ink)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);color:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar p{margin:0;flex:1 1 180px;font-size:14px}
.savebar .btn{border-color:transparent}
.savebar .btn.ghost{background:transparent;color:var(--bg);border-color:var(--muted)}
.guide h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:20px;margin:24px 0 8px}
.week{display:grid;gap:6px}
.week div{display:grid;grid-template-columns:52px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.week b{font-family:var(--display);font-size:18px;text-transform:uppercase}
.guide ol,.guide ul{margin:0;padding-left:22px;display:grid;gap:8px}
.guide .callout{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:8px}
.bu-wrap{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.bu{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.bu th,.bu td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.bu thead th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--cond)}
.bu tbody th{font-family:var(--display);font-size:18px;white-space:nowrap}
.bu tbody tr:last-child th,.bu tbody tr:last-child td{border-bottom:0}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px}
@media (max-width:420px){form.edit{grid-template-columns:1fr}.dayedit{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.btn.small{padding:2px 8px;font-size:12px}
.bk{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.restore{display:grid;gap:8px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.restore label{font-size:13px;color:var(--muted)}
.restore textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px;font:13px/1.4 ui-monospace,monospace}
.restore .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.restore .err,.guide .err{color:var(--danger);font-size:14px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script type="application/json" id="plan-data">
{"days":[{"id":"d1","weekday":"Mon","title":"Lower A: hips and glutes","focus":"Rebuild the hip. Glute strength through a range that doesn't hurt.","sections":[{"id":"d1k","kind":"cond","title":"Conditioning: rower","minutes":18,"note":"Start here. The rower is low-impact, so it's kind to the hip before a leg day.","items":[{"id":"a1","name":"Easy row","sets":1,"reps":"5 min","rest":"","note":"Build from very easy to moderate. Push with the legs, then pull with the arms.","q":"rowing machine technique"},{"id":"a2","name":"Rower intervals","sets":8,"reps":"250 m hard","rest":"90 s easy row","note":"Weeks 1-2: 5 rounds at a steady-hard pace. Weeks 3-4: 6 rounds. Week 5 on: 8 rounds. Try to hold the same split time every round.","q":"rowing machine interval workout"}]},{"id":"d1w","kind":"warm","title":"Hip prep","minutes":10,"items":[{"id":"a3","name":"90/90 hip switches","sets":2,"reps":"8 / side","rest":"","note":"Slow. Only go as far as the hip allows.","q":"90 90 hip switch mobility"},{"id":"a4","name":"Glute bridge with 2 s pause","sets":2,"reps":"12","rest":"","note":"Feel it in the glutes, not the low back.","q":"glute bridge"},{"id":"a5","name":"Banded clamshell","sets":2,"reps":"15 / side","rest":"","note":"Mini band just above the knees. Bring a band if the gym has none."},{"id":"a6","name":"Side-lying leg raise","sets":2,"reps":"12 / side","rest":"","note":"Toes point forward, lead with the heel.","q":"side lying hip abduction"},{"id":"a7","name":"Bird dog","sets":2,"reps":"8 / side","rest":"","note":"Keep the hips level and reach long."}]},{"id":"d1s","kind":"strength","title":"Strength","minutes":45,"items":[{"id":"a8","name":"Goblet box squat","sets":4,"reps":"8","rest":"90 s","note":"Sit back to a bench at a height that doesn't hurt. Go lower over the weeks.","q":"goblet box squat"},{"id":"a9","name":"Dumbbell Romanian deadlift","sets":4,"reps":"8","rest":"90 s","note":"Hips back, soft knees, flat back. Stop when the hamstrings are tight."},{"id":"a10","name":"Hip thrust","sets":4,"reps":"10","rest":"90 s","note":"Upper back on a bench, dumbbell on the hips. Pause 1 s at the top.","q":"dumbbell hip thrust"},{"id":"a11","name":"Split squat","sets":3,"reps":"8 / side","rest":"60 s","note":"Hold the bench for balance in weeks 1 and 2. Front knee follows the toes.","q":"dumbbell split squat"},{"id":"a12","name":"Banded lateral walk","sets":3,"reps":"12 steps each way","rest":"45 s","note":"Stay low with toes forward. The burn on the side of the hip is the point.","q":"banded lateral walk"},{"id":"a13","name":"Single-leg calf raise","sets":3,"reps":"12 / side","rest":"45 s","note":"Full range on a step."}]},{"id":"d1c","kind":"core","title":"Core and obliques","minutes":15,"items":[{"id":"a14","name":"Dead bug","sets":3,"reps":"10 / side","rest":"30 s","note":"Low back stays pressed into the floor the whole time."},{"id":"a15","name":"Side plank","sets":3,"reps":"30 s / side","rest":"30 s","note":"Obliques. Drop to the knees if your hips sag."},{"id":"a16","name":"Pallof press","sets":3,"reps":"10 / side","rest":"30 s","note":"Cable or band. Don't let it twist you.","q":"pallof press"},{"id":"a17","name":"Reverse crunch","sets":3,"reps":"12","rest":"30 s","note":"Curl the hips off the floor. No swinging."}]},{"id":"d1x","kind":"cool","title":"Cool-down","minutes":10,"items":[{"id":"a18","name":"Half-kneeling hip flexor stretch","sets":2,"reps":"45 s / side","rest":"","note":"Squeeze the glute of the leg that's down and tuck the pelvis under.","q":"half kneeling hip flexor stretch"},{"id":"a19","name":"Figure-4 stretch on your back","sets":2,"reps":"45 s / side","rest":"","note":"Ease off if the hip pinches.","q":"supine figure 4 stretch"},{"id":"a20","name":"Hamstring stretch with strap","sets":2,"reps":"45 s / side","rest":"","note":"On your back, leg straight up. Use a towel or band.","q":"lying hamstring stretch strap"}]}]},{"id":"d2","weekday":"Tue","title":"Upper: push, pull, carry","focus":"Your main running day (legs are fresh), then upper-body strength.","sections":[{"id":"d2k","kind":"cond","title":"Conditioning: treadmill run build-up","minutes":25,"note":"Start here. Follow the stage for your week. Check the build-up on the Guide tab.","items":[{"id":"b1","name":"Brisk walk","sets":1,"reps":"5 min","rest":"","note":"Raise the speed every minute until you're nearly jogging.","q":"treadmill warm up walk"},{"id":"b2","name":"Run / walk intervals","sets":8,"reps":"see stage","rest":"","note":"Weeks 1-2: 1 min jog / 2 min walk. Weeks 3-4: 2 min jog / 1 min walk. Weeks 5-6: 20 min easy jog, no stops (tick 1 circle per 2.5 min). Week 7 on: 3 × 6 min at 'comfortably hard' with 2 min walk.","q":"run walk interval beginner"},{"id":"b3","name":"Cool walk","sets":1,"reps":"3 min","rest":"","note":"Bring the breathing down before you lift."}]},{"id":"d2w","kind":"warm","title":"Hip and shoulder prep","minutes":10,"items":[{"id":"b4","name":"Frog pump","sets":2,"reps":"20","rest":"","note":"Soles of the feet together, knees out, short quick bridges.","q":"frog pump glute"},{"id":"b5","name":"Fire hydrant","sets":2,"reps":"10 / side","rest":"","note":"On all fours, lift the knee out to the side. Keep the back still.","q":"fire hydrant exercise"},{"id":"b6","name":"Quadruped hip circles","sets":2,"reps":"6 / side each way","rest":"","note":"Big slow circles with the knee. Smaller circles on the stiffer side if needed.","q":"quadruped hip circles"},{"id":"b7","name":"Band pull-apart","sets":2,"reps":"15","rest":"","note":"Arms straight, squeeze the shoulder blades."},{"id":"b8","name":"Scap push-up","sets":2,"reps":"10","rest":"","note":"Arms straight. Only the shoulder blades move.","q":"scapular push up"}]},{"id":"d2s","kind":"strength","title":"Strength","minutes":45,"items":[{"id":"b9","name":"Dumbbell bench press","sets":4,"reps":"8","rest":"90 s","note":"Feet flat, shoulder blades pinched."},{"id":"b10","name":"One-arm dumbbell row","sets":4,"reps":"10 / side","rest":"60 s","note":"Hand and knee on the bench, pull the elbow to the hip."},{"id":"b11","name":"Half-kneeling dumbbell press","sets":3,"reps":"8 / side","rest":"60 s","note":"Kneeling stretches the hip flexor too. Squeeze the glute of the down leg.","q":"half kneeling single arm dumbbell press"},{"id":"b12","name":"Lat pulldown or pull-up","sets":3,"reps":"8","rest":"90 s","note":"No machine? Use a band for assisted pull-ups.","q":"band assisted pull up"},{"id":"b13","name":"Push-up","sets":3,"reps":"max, stop 2 before failure","rest":"60 s","note":"Body in one straight line."},{"id":"b14","name":"Face pull","sets":3,"reps":"15","rest":"45 s","note":"Cable or band. Good for shoulders and posture.","q":"cable face pull"}]},{"id":"d2c","kind":"core","title":"Core and obliques","minutes":15,"items":[{"id":"b15","name":"Slow Russian twist","sets":3,"reps":"12 / side","rest":"30 s","note":"Light dumbbell. Turn from the ribs, not the arms."},{"id":"b16","name":"Side plank hip dip","sets":3,"reps":"10 / side","rest":"30 s","note":"Lower the hip a few cm and lift it back up.","q":"side plank hip dips"},{"id":"b17","name":"Plank walkout","sets":3,"reps":"8","rest":"30 s","note":"Ab wheel instead if the gym has one.","q":"plank walkout"},{"id":"b18","name":"Suitcase carry","sets":3,"reps":"30 m / side","rest":"45 s","note":"Heavy dumbbell in one hand, walk tall. The obliques stop the lean."}]},{"id":"d2x","kind":"cool","title":"Cool-down","minutes":8,"items":[{"id":"b19","name":"Doorway chest stretch","sets":2,"reps":"30 s","rest":"","note":"Forearm on the door frame, step through."},{"id":"b20","name":"Kneeling lat stretch on a bench","sets":2,"reps":"30 s","rest":"","note":"Elbows on the bench, sit the hips back, let the chest drop.","q":"kneeling lat stretch bench"},{"id":"b21","name":"Lying spinal twist","sets":2,"reps":"30 s / side","rest":"","note":"Knees to one side, look the other way. Gentle on the hip.","q":"supine spinal twist"}]}]},{"id":"d3","weekday":"Thu","title":"Lower B: single leg and soccer","focus":"One leg at a time, groin and hamstring protection, and the first steps of power.","sections":[{"id":"d3k","kind":"cond","title":"Conditioning: jump rope and bike","minutes":20,"note":"Start here. Rope trains the quick feet soccer needs; the bike adds volume without pounding the hip.","items":[{"id":"c1","name":"Easy bike","sets":1,"reps":"5 min","rest":"","note":"Build from easy to moderate."},{"id":"c2","name":"Jump rope rounds","sets":8,"reps":"30 s on / 30 s off","rest":"","note":"Weeks 1-2: 20 s on, both feet, low hops. Weeks 3-4: 30 s. Week 5 on: 40 s and try alternating feet. Stop if the hip complains.","q":"jump rope for beginners"},{"id":"c3","name":"Bike tempo","sets":1,"reps":"8 min","rest":"","note":"7 out of 10 effort: you can talk in short sentences only."}]},{"id":"d3w","kind":"warm","title":"Hip prep","minutes":10,"items":[{"id":"c4","name":"Glute bridge march","sets":2,"reps":"8 / side","rest":"","note":"Hold the bridge and lift one foot at a time. Hips stay level.","q":"glute bridge march"},{"id":"c5","name":"Banded monster walk","sets":2,"reps":"10 steps forward and back","rest":"","note":"Band around the ankles or knees, stay low.","q":"banded monster walk"},{"id":"c6","name":"Supported hip airplane","sets":2,"reps":"5 / side","rest":"","note":"Hold a rack, stand on one leg, slowly turn the hips open and closed. Great for hip control and balance.","q":"supported hip airplane"},{"id":"c7","name":"Leg swings","sets":1,"reps":"10 / side, front and side","rest":"","note":"Hold a rack. Make the swings bigger as you warm up.","q":"leg swings warm up"}]},{"id":"d3s","kind":"strength","title":"Strength","minutes":45,"items":[{"id":"c8","name":"Dumbbell or trap bar deadlift","sets":4,"reps":"6","rest":"2 min","note":"The heaviest lift of the week. Stop the set when your form slips.","q":"trap bar deadlift"},{"id":"c9","name":"Step-up","sets":3,"reps":"8 / side","rest":"60 s","note":"Box at knee height or lower. Push through the heel of the top leg.","q":"dumbbell step up"},{"id":"c10","name":"Single-leg Romanian deadlift","sets":3,"reps":"8 / side","rest":"60 s","note":"Hold a rack for balance at first. Great for the side glute.","q":"single leg romanian deadlift"},{"id":"c11","name":"Lateral lunge","sets":3,"reps":"8 / side","rest":"60 s","note":"Hip and groin strength for cutting and turning.","q":"dumbbell lateral lunge"},{"id":"c12","name":"Copenhagen plank, short version","sets":3,"reps":"20 s / side","rest":"45 s","note":"Knee on the bench, not the foot. Protects the groin.","q":"copenhagen plank short lever"},{"id":"c13","name":"Slider hamstring curl","sets":3,"reps":"8","rest":"60 s","note":"Towels on a smooth floor. Protects the hamstrings for sprinting.","q":"slider hamstring curl"},{"id":"c14","name":"Low box jump","sets":3,"reps":"5","rest":"60 s","note":"Start in week 4, and only if the hip has no pain. Step down, don't jump down.","q":"low box jump step down"}]},{"id":"d3c","kind":"core","title":"Core and obliques","minutes":15,"items":[{"id":"c15","name":"Cable woodchop, high to low","sets":3,"reps":"10 / side","rest":"30 s","note":"Turn through the torso and pivot the back foot.","q":"cable woodchop high to low"},{"id":"c16","name":"Hollow hold","sets":3,"reps":"20 s","rest":"30 s","note":"Bend the knees to make it easier."},{"id":"c17","name":"Side plank reach-through","sets":3,"reps":"8 / side","rest":"30 s","note":"Thread the top arm under your body and back up.","q":"side plank reach through"},{"id":"c18","name":"Slow bicycle crunch","sets":3,"reps":"20 total","rest":"30 s","note":"Elbow toward the opposite knee. Slow is harder."}]},{"id":"d3x","kind":"cool","title":"Cool-down","minutes":10,"items":[{"id":"c19","name":"Adductor rock back","sets":2,"reps":"8 / side","rest":"","note":"On all fours with one leg out to the side. Rock back gently.","q":"adductor rock back"},{"id":"c20","name":"Seated glute stretch","sets":2,"reps":"45 s / side","rest":"","note":"Sit tall, ankle over the other knee, lean forward from the hips.","q":"seated glute stretch"},{"id":"c21","name":"Standing quad stretch","sets":2,"reps":"30 s / side","rest":"","note":"Hold a rack. Knees together, squeeze the glute.","q":"standing quad stretch"}]}]},{"id":"d4","weekday":"Sat","title":"Full body: match engine","focus":"Repeat sprints like a match, then lighter full-body strength.","sections":[{"id":"d4k","kind":"cond","title":"Conditioning: match intervals","minutes":22,"note":"Start here. Same 15/15 workout every week, but the machine moves toward real running as the weeks go by.","items":[{"id":"e1","name":"Easy jog or incline walk","sets":1,"reps":"5 min","rest":"","note":"Treadmill. Finish the last minute a bit faster.","q":"treadmill incline walk"},{"id":"e2","name":"15/15 repeat efforts","sets":2,"reps":"10 × (15 s fast / 15 s easy)","rest":"3 min","note":"Weeks 1-3: on the bike or rower. Weeks 4-6: treadmill, fast walk on a 6-8% incline. Week 7 on: treadmill run, 15 s fast / 15 s straddle the belt.","q":"15 15 interval training"},{"id":"e3","name":"Rower flush","sets":1,"reps":"4 min easy","rest":"","note":"Easy pace to recover before lifting."}]},{"id":"d4w","kind":"warm","title":"Hip prep and agility","minutes":12,"items":[{"id":"e4","name":"Reverse clamshell","sets":2,"reps":"12 / side","rest":"","note":"Knees together, lift the foot up. Trains the hip's rotators.","q":"reverse clamshell"},{"id":"e5","name":"Standing hip circles (CARs)","sets":2,"reps":"5 / side each way","rest":"","note":"Hold a rack. Slowest, biggest circle the hip allows without pain.","q":"standing hip CARs"},{"id":"e6","name":"Single-leg balance reach","sets":2,"reps":"4 reaches / side","rest":"","note":"Stand on one leg, tap the other foot forward, side and back.","q":"single leg balance reach star excursion"},{"id":"e7","name":"A-skip","sets":2,"reps":"20 m","rest":"","note":"Drive the knee up, land on the forefoot.","q":"a skip running drill"},{"id":"e8","name":"Lateral shuffle","sets":2,"reps":"20 m each way","rest":"","note":"Stay low and don't cross the feet.","q":"lateral shuffle drill"},{"id":"e9","name":"5-10-5 shuttle","sets":4,"reps":"1 run","rest":"60 s","note":"Week 4 on, only if there's room and the hip feels good. Change direction under control.","q":"5-10-5 pro agility drill"}]},{"id":"d4s","kind":"strength","title":"Strength","minutes":35,"items":[{"id":"e10","name":"Dumbbell sumo squat","sets":3,"reps":"10","rest":"60 s","note":"Wide stance, toes out. Works the glutes and inner thighs. Same pain-free depth rule.","q":"dumbbell sumo squat"},{"id":"e11","name":"Assisted chin-up","sets":3,"reps":"6-8","rest":"90 s","note":"Palms facing you. Band or machine, full hang at the bottom.","q":"band assisted chin up"},{"id":"e12","name":"Cable or band pull-through","sets":3,"reps":"12","rest":"60 s","note":"Face away from the anchor, hinge back, snap the hips forward and squeeze.","q":"cable pull through"},{"id":"e13","name":"Incline dumbbell press","sets":3,"reps":"10","rest":"60 s","note":"Bench at a low incline."},{"id":"e14","name":"Farmer carry","sets":3,"reps":"40 m","rest":"60 s","note":"Heavy, stand tall, quick steps."}]},{"id":"d4c","kind":"core","title":"Core and obliques","minutes":15,"items":[{"id":"e15","name":"Pallof press walkout","sets":3,"reps":"8 / side","rest":"30 s","note":"Press out, step sideways away from the anchor, step back.","q":"pallof press walkout"},{"id":"e16","name":"Hanging knee raise","sets":3,"reps":"10","rest":"30 s","note":"Once it gets easy, bring the knees to each side for the obliques.","q":"hanging knee raise oblique"},{"id":"e17","name":"Half-kneeling cable lift, low to high","sets":3,"reps":"10 / side","rest":"30 s","note":"The opposite of Thursday's woodchop. Hips stay square, the torso turns.","q":"half kneeling cable lift"},{"id":"e18","name":"Cross-body mountain climber","sets":3,"reps":"20 total","rest":"30 s","note":"Knee toward the opposite elbow.","q":"cross body mountain climber"}]},{"id":"d4x","kind":"cool","title":"Cool-down","minutes":10,"items":[{"id":"e19","name":"Lunge stretch with side reach","sets":2,"reps":"45 s / side","rest":"","note":"Back knee down, reach the same-side arm up and over.","q":"kneeling hip flexor stretch side bend"},{"id":"e20","name":"Butterfly stretch","sets":2,"reps":"45 s","rest":"","note":"Soles together, let the knees drop. Don't force it.","q":"butterfly stretch"},{"id":"e21","name":"Calf stretch on a wall","sets":2,"reps":"30 s / side","rest":"","note":"Do it with the knee straight, then bent."}]}]}],"week":[{"day":"Mon","what":"Gym: rower, then Lower A, hips and glutes"},{"day":"Tue","what":"Gym: treadmill run build-up, then Upper"},{"day":"Wed","what":"Off: 30 min brisk walk plus 10 min of any hip prep at home"},{"day":"Thu","what":"Gym: jump rope and bike, then Lower B, single leg and soccer"},{"day":"Fri","what":"Off, or soccer training"},{"day":"Sat","what":"Gym: match intervals, then full body"},{"day":"Sun","what":"Rest, or an easy walk"}],"buildup":[{"weeks":"1-2","tue":"8 × (1 min jog / 2 min walk)","thu":"Rope 20 s on / 40 s off, both feet","sat":"15/15 on the bike or rower"},{"weeks":"3-4","tue":"8 × (2 min jog / 1 min walk)","thu":"Rope 30 s on / 30 s off","sat":"15/15 on the bike or rower (wk 3), incline fast walk (wk 4)"},{"weeks":"5-6","tue":"20 min easy jog, no stops","thu":"Rope 40 s on / 20 s off, try alternating feet","sat":"15/15 incline fast walk on the treadmill"},{"weeks":"7+","tue":"3 × 6 min comfortably hard, 2 min walk","thu":"Rope 40 s, add double-unders or side-to-side hops","sat":"15/15 treadmill run"}],"rules":["If you have a hip injury or have had hip surgery, check this plan with your physio first, especially the running, jump rope, jumps and Copenhagen planks.","Some discomfort is fine: up to 3 out of 10 that's gone by the next morning. Sharp or pinching pain in the hip means stop that exercise and swap it.","Running and rope move up one stage only when the current stage felt easy and the hip was quiet the next day. If not, repeat the stage. Going back a stage is fine.","Weeks 1 and 2: light weights, finishing every set with 3-4 reps left. You're learning the movements.","To progress, add reps first and weight second. Change one thing at a time.","Always do one-leg work on the weaker side first, then match the reps on the stronger side.","Box jumps and shuttles start in week 4, only once the hip is pain-free in the strength work."],"fuel":["Protein: about 1.6-2 g per kg of body weight a day. That is what keeps the muscle while you get leaner.","Eat about 300-500 kcal a day below what keeps your weight steady. Aim to lose no more than 0.5 kg a week, so your strength keeps going up.","Sleep 7-8 hours. Recovery is where most of the progress happens."]}
