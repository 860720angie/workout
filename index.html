<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pitch Ready</title>
<meta name="description" content="A 4-day gym plan for soccer: conditioning, hip and glute strength, core and obliques.">
<meta name="theme-color" content="#1E7A47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one narrow column like a coach's clipboard; sticky day tabs; each block colour-coded by its job. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#14201A; --muted:#5C6B62; --line:#DCE3DD;
  --accent:#1E7A47; --accent-ink:#FFFFFF; --accent-soft:#E2F1E7;
  --warm:#B7791F; --strength:#1E7A47; --core:#C2412D; --cond:#2364A6; --cool:#4F6B78;
  --tick:#1E7A47; --danger:#B42318;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#16211B; --ink:#E6EDE8; --muted:#97A89D; --line:#27352D;
  --accent:#4CC27E; --accent-ink:#06210F; --accent-soft:#183224;
  --warm:#E0A646; --strength:#4CC27E; --core:#F07A63; --cond:#6AA8E8; --cool:#93AEBB;
  --tick:#4CC27E; --danger:#F97066; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16211B; --ink:#E6EDE8; --muted:#97A89D; --line:#27352D;
  --accent:#4CC27E; --accent-ink:#06210F; --accent-soft:#183224;
  --warm:#E0A646; --strength:#4CC27E; --core:#F07A63; --cond:#6AA8E8; --cool:#93AEBB;
  --tick:#4CC27E; --danger:#F97066; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1}
.brand small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:64px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;text-align:left}
.tab b{display:block;font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.tab span{font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] span{color:inherit;opacity:.85}
.dayhead{padding-block:18px 6px}
.dayhead h2{font-family:var(--display);font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
.dayhead p{margin:6px 0 0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tick);transition:width .3s}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-top:3px solid var(--c);padding-top:8px}
.sec-h h3{margin:0;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;color:var(--c)}
.sec-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-note{font-size:14px;color:var(--muted);margin:4px 0 0}
.k-warm{--c:var(--warm)} .k-strength{--c:var(--strength)} .k-core{--c:var(--core)} .k-cond{--c:var(--cond)} .k-cool{--c:var(--cool)}
ul.ex-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.ex.done{opacity:.6}
.ex-main{min-width:0}
.ex-name{font-weight:600;font-size:17px;line-height:1.25}
.ex-rx{font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:2px}
.ex-rx em{font-style:normal;color:var(--muted)}
.ex-note{font-size:14px;color:var(--muted);margin-top:4px}
.watch{display:inline-flex;align-items:center;gap:6px;align-self:start;text-decoration:none;font-size:14px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:6px 12px;white-space:nowrap}
.watch svg{width:12px;height:12px;fill:currentColor}
.sets{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.set{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;display:grid;place-items:center}
.set.on{background:var(--tick);border-color:var(--tick);color:var(--accent-ink)}
.tools{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.tools .btn{padding:6px 10px;font-size:13px}
.add{margin-top:8px;width:100%;border:1px dashed var(--c);color:var(--c);background:transparent;border-radius:10px;padding:10px;font-weight:600}
form.edit{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:12px;margin-top:8px}
form.edit label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
form.edit label.full{grid-column:1/-1}
form.edit input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px;font-size:16px;color:var(--ink)}
form.edit .row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
form.edit .err{grid-column:1/-1;color:var(--danger);font-size:14px;margin:0}
.dayedit{display:grid;grid-template-columns:90px 1fr;gap:10px;margin-top:12px}
.dayedit label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.dayedit label.full{grid-column:1/-1}
.dayedit input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px;font-size:16px;color:var(--ink)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);color:var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar p{margin:0;flex:1 1 180px;font-size:14px}
.savebar .btn{border-color:transparent}
.savebar .btn.ghost{background:transparent;color:var(--bg);border-color:var(--muted)}
.guide h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;font-size:20px;margin:24px 0 8px}
.week{display:grid;gap:6px}
.week div{display:grid;grid-template-columns:52px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.week b{font-family:var(--display);font-size:18px;text-transform:uppercase}
.guide ol,.guide ul{margin:0;padding-left:22px;display:grid;gap:8px}
.guide .callout{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:8px}
.bu-wrap{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.bu{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.bu th,.bu td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.bu thead th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--cond)}
.bu tbody th{font-family:var(--display);font-size:18px;white-space:nowrap}
.bu tbody tr:last-child th,.bu tbody tr:last-child td{border-bottom:0}
.msg{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:14px}
@media (max-width:420px){form.edit{grid-template-columns:1fr}.dayedit{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.btn.small{padding:2px 8px;font-size:12px}
.bk{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.restore{display:grid;gap:8px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.restore label{font-size:13px;color:var(--muted)}
.restore textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px;font:13px/1.4 ui-monospace,monospace}
.restore .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.restore .err,.guide .err{color:var(--danger);font-size:14px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.wk-c{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 2px;display:grid;justify-items:center;gap:1px;min-width:0;font-size:11px;color:var(--muted)}
.wk-c b{font-family:var(--display);font-size:15px;color:var(--ink);text-transform:uppercase}
.wk-c span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-c i{font-style:normal;font-weight:700;height:16px;line-height:16px}
.wk-c[disabled]{opacity:.55;cursor:default}
.wk-c.is-today{outline:2px solid var(--ink);outline-offset:-1px}
.wk-c.st-done{background:var(--tick);border-color:var(--tick);color:var(--accent-ink)}
.wk-c.st-done b{color:var(--accent-ink)}
.wk-c.st-min{background:var(--accent-soft);border-color:var(--tick)}
.wk-c.st-min i{color:var(--tick)}
.wk-c.st-missed{border-color:var(--danger)}
.wk-c.st-missed i{color:var(--danger)}
.wk-c.st-today{border-color:var(--accent)}
.status{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}
.nag{margin-top:10px;padding:10px 12px;border-radius:8px;border-left:4px solid var(--danger);background:var(--surface);font-size:14px}
.note-b{margin-top:10px;padding:10px 12px;border-radius:8px;border-left:4px solid var(--warm);background:var(--surface);font-size:14px}
.banner{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.banner.today{border-color:var(--accent);background:var(--accent-soft)}
.banner.ok{border-color:var(--tick);background:var(--accent-soft);font-weight:600}
.banner.miss{border-color:var(--danger)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.move{margin-top:8px;display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.move p{margin:0 0 4px;font-weight:600}
.muted{color:var(--muted);font-weight:400}
.mv{display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-align:left;border:1px solid var(--accent);background:var(--bg);border-radius:8px;padding:10px 12px}
.mv span{font-size:13px;color:var(--muted)}
.mv.no{border-color:var(--line);opacity:.6;cursor:default}
.stage{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--surface);border:1px dashed var(--cond);font-size:14px}
.finish{display:block;width:100%;margin-top:24px;border:0;border-radius:12px;padding:16px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.center{text-align:center}
.tab.tdone b{color:var(--tick)}
.tab.tdone[aria-selected="true"] b{color:inherit}
.bu tr.cur td,.bu tr.cur th{background:var(--accent-soft)}
.startlab{display:grid;gap:4px;margin-top:10px;font-size:13px;color:var(--muted)}
.startlab input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px;font-size:16px;max-width:220px}
</style>
</head>

e hamstrings are tight."},{"id":"a10","name":"Hip thrust","sets":4,"reps":"10","rest":"90 s","note":"Upper back on a bench, dumbbell on the hips. Pause 1 s at the top.","q":"dumbbell hip thrust"},{"id":"a11","name":"Split squat","sets":3,"reps":"8 / side","rest":"60 s","note":"Hold the bench for balance in weeks 1 and 2. Front knee follows the toes.","q":"dumbbell split squat"},{"id":"a12","name":"Banded lateral walk","sets":3,"reps":"12 steps each way","rest":"45 s","note":"Stay low with toes forward. The burn on the side of the hip is the point.","q":"banded lateral walk"},{"id":"a13","name":"Single-leg calf raise","sets":3,"reps":"12 / side","rest":"45 s","note":"Full range on a step."}]},{"id":"d1c","kind":"core","title":"Core and obliques","minutes":15,"items":[{"id":"a14","name":"Dead bug","sets":3,"reps":"10 / side","rest":"30 s","note":"Low back stays pressed into the floor the whole time."},{"id":"a15","name":"Side plank","sets":3,"reps":"30 s / side","rest":"30 s","note":"Obliques. Drop to the knees if your hips sag."},{"id":"a16","name":"Pallof press","sets":3,"reps":"10 / side","rest":"30 s","note":"Cable or band. Don't let it twist you.","q":"pallof press"},{"id":"a17","name":"Reverse crunch","sets":3,"reps":"12","rest":"30 s","note":"Curl the hips off the floor. No swinging."}]},{"id":"d1x","kind":"cool","title":"Cool-down","minutes":10,"items":[{"id":"a18","name":"Half-kneeling hip flexor stretch","sets":2,"reps":"45 s / side","rest":"","note":"Squeeze the glute of the leg that's down and tuck the pelvis under.","q":"half kneeling hip flexor stretch"},{"id":"a19","name":"Figure-4 stretch on your back","sets":2,"reps":"45 s / side","rest":"","note":"Ease off if the hip pinches.","q":"supine figure 4 stretch"},{"id":"a20","name":"Hamstring stretch with strap","sets":2,"reps":"45 s / side","rest":"","note":"On your back, leg straight up. Use a towel or band.","q":"lying hamstring stretch strap"}]}]},{"id":"d2","weekday":"Tue","title":"Upper: push, pull, engine you built in Block 1.","q":"15 15 interval run"}]},{"id":"f4w","kind":"warm","title":"Hip prep and footwork","minutes":12,"items":[{"id":"p4","name":"Inchworm","sets":2,"reps":"5","rest":"","note":"Walk the hands out to a plank and back. Soft knees are fine.","q":"inchworm exercise"},{"id":"p5","name":"Carioca","sets":2,"reps":"20 m each way","rest":"","note":"Sideways, back foot crosses in front and behind. Loosens the hips.","q":"carioca drill"},{"id":"p6","name":"High knees","sets":2,"reps":"20 m","rest":"","note":"Quick and light, stay tall."},{"id":"p7","name":"Backpedal","sets":2,"reps":"20 m","rest":"","note":"Stay low, push off the front of the foot.","q":"backpedal drill"},{"id":"p8","name":"Sprint and stop","sets":4,"reps":"1","rest":"45 s","note":"Run 10 m, stop within 3 steps, low and balanced. Teaches the hip to brake.","q":"deceleration drill soccer"}]},{"id":"f4s","kind":"strength","title":"Strength","minutes":35,"items":[{"id":"p9","name":"Dumbbell thruster","sets":3,"reps":"8","rest":"75 s","note":"Squat to pain-free depth, drive up and press overhead in one move.","q":"dumbbell thruster"},{"id":"p10","name":"Neutral-grip pull-up or pulldown","sets":3,"reps":"8","rest":"90 s","note":"Palms facing each other. Band if needed.","q":"neutral grip pull up"},{"id":"p11","name":"Dumbbell swing","sets":3,"reps":"12","rest":"60 s","note":"A hip snap, not a squat. Only if the hip is pain-free; otherwise do more pull-throughs.","q":"dumbbell swing"},{"id":"p12","name":"T push-up","sets":3,"reps":"6 / side","rest":"60 s","note":"Push up, then rotate one arm to the ceiling.","q":"t push up"},{"id":"p13","name":"Goblet march","sets":3,"reps":"30 m","rest":"60 s","note":"Heavy dumbbell at the chest, slow high-knee march.","q":"goblet carry march"}]},{"id":"f4c","kind":"core","title":"Core and obliques","minutes":15,"items":[{"id":"p14","name":"Stir the pot","sets":3,"reps":"6 circles / way","rest":"30 s","note":"Forearms on a ball, small circles. No ball: plank and draw small circles with the elbows.","q":"stir the pot exercise"},{"id":"p15","name":"Windshield wipers, knees bent","sets":3,"reps":"8 / side","rest":"30 s","note":"On your back, knees up, lower them side to side. Shoulders stay down.","q":"bent knee windshield wipers"},{"id":"p16","name":"Kneeling cable crunch","sets":3,"reps":"12","rest":"30 s","note":"Rope at the head, crunch the ribs toward the hips."},{"id":"p17","name":"Med ball rotational throw","sets":3,"reps":"8 / side","rest":"30 s","note":"Side-on to a wall, throw from the hips. No ball: fast band rotations.","q":"medicine ball rotational throw wall"}]},{"id":"f4x","kind":"cool","title":"Cool-down","minutes":10,"items":[{"id":"p18","name":"World's greatest stretch","sets":2,"reps":"5 / side","rest":"","note":"Lunge, elbow to instep, rotate up. Gently on the stiffer side.","q":"worlds greatest stretch"},{"id":"p19","name":"Seated straddle stretch","sets":2,"reps":"45 s","rest":"","note":"Legs wide, walk the hands forward."},{"id":"p20","name":"Ankle rocks on a wall","sets":2,"reps":"10 / side","rest":"","note":"Knee forward over the toes, heel stays down.","q":"knee to wall ankle mobility"}]}]}],"progressive":false}],"buildup":[{"weeks":"1-2","mon":"5 × 250 m","tue":"8 × (1 min jog / 2 min walk)","thu":"Rope 20 s on / 40 s off, both feet","sat":"15/15 on the bike or rower"},{"weeks":"3-4","mon":"6 × 250 m","tue":"8 × (2 min jog / 1 min walk)","thu":"Rope 30 s on / 30 s off","sat":"15/15 on the bike or rower (wk 3), incline fast walk (wk 4)"},{"weeks":"5-6","mon":"8 × 250 m","tue":"20 min easy jog, no stops","thu":"Rope 40 s on / 20 s off, try alternating feet","sat":"15/15 incline fast walk on the treadmill"},{"weeks":"7+","mon":"8 × 250 m, beat your split times","tue":"3 × 6 min comfortably hard, 2 min walk","thu":"Rope 40 s, add double-unders or side-to-side hops","sat":"15/15 treadmill run"}],"week":[{"day":"Mon","what":"Lower A (default)"},{"day":"Tue","what":"Upper (default)"},{"day":"Wed","what":"Off: 30 min brisk walk plus 10 min of any hip prep at home"},{"day":"Thu","what":"Lower B (default)"},{"day":"Fri","what":"Off, or soccer training"},{"day":"Sat","what":"Full body (default)"},{"day":"Sun","what":"Rest, or an easy walk"}],"rules":["If you have a hip injury or have had hip surgery, check this plan with your physio first, especially the running, jump rope, jumps and Copenhagen planks.","Some discomfort is fine: up to 3 out of 10 that's gone by the next morning. Sharp or pinching pain in the hip means stop that exercise and swap it.","Running and rope move up one stage only when the current stage felt easy and the hip was quiet the next day. If not, repeat the stage. Going back a stage is fine.","Weeks 1 and 2: light weights, finishing every set with 3-4 reps left. You're learning the movements.","To progress, add reps first and weight second. Change one thing at a time.","Always do one-leg work on the weaker side first, then match the reps on the stronger side.","Box jumps and shuttles start in week 4, only once the hip is pain-free in the strength work."],"discipline":["4 workouts a week is the target. The week runs Monday to Sunday.","Sore or tired? Move the workout to a later day this week. You get 2 moves a week.","The app won’t let you put Lower A and Lower B on back-to-back days, or train 3 days in a row. That protects the hip.","No energy at all? Do the minimum session: conditioning, hip prep and core. It still counts.","Never miss twice. Missing one session is normal. Missing the next one too is how habits break.","Tap Finish at the end of every session. That builds your weekly record and streak."],"fuel":["Protein: about 1.6-2 g per kg of body weight a day. That is what keeps the muscle while you get leaner.","Eat about 300-500 kcal a day below what keeps your weight steady. Aim to lose no more than 0.5 kg a week, so your strength keeps going up.","Sleep 7-8 hours. Recovery is where most of the progress happens."]}
